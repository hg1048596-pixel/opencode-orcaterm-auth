name: Publish npm mirror to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to mirror (empty uses package.json)
        required: false
        type: string
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/workflows/publish-github-packages.yml
      - scripts/prepare-github-package.mjs
      - test/github-package.test.mjs

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-mirror
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hg1048596-pixel/opencode-orcaterm-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@hg1048596-pixel'
          package-manager-cache: false
      - name: Check mirror preparation
        run: node --test test/github-package.test.mjs
      - name: Select published npm version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const tagged = process.env.GITHUB_REF_TYPE === 'tag' ? process.env.GITHUB_REF_NAME.replace(/^v/, '') : ''
          const version = process.env.REQUESTED_VERSION || tagged || JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid package version')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          NODE
      - name: Download and prepare the published npm artifact
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-source"
          npm pack "opencode-orcaterm-auth@$PACKAGE_VERSION" --registry=https://registry.npmjs.org --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-source"
          tar -xzf "$RUNNER_TEMP/npm-source/opencode-orcaterm-auth-$PACKAGE_VERSION.tgz" -C "$RUNNER_TEMP/npm-source"
          node scripts/prepare-github-package.mjs "$RUNNER_TEMP/npm-source/package" "$PACKAGE_VERSION"
          node --input-type=module -e 'import { pathToFileURL } from "node:url"; await import(pathToFileURL(process.env.RUNNER_TEMP + "/npm-source/package/index.mjs"))'
      - name: Publish and verify the GitHub package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="@hg1048596-pixel/opencode-orcaterm-auth@$PACKAGE_VERSION"
          if npm view "$package" version --registry=https://npm.pkg.github.com --json > "$RUNNER_TEMP/github-package.json" 2> "$RUNNER_TEMP/github-package-error.log"; then
            echo "GitHub Packages already contains $package"
          else
            node --input-type=module -e 'import fs from "node:fs"; const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/github-package.json", "utf8")); if (result.error?.code !== "E404") throw new Error("GitHub registry lookup failed: " + (result.error?.code || "unknown"))'
            npm publish "$RUNNER_TEMP/npm-source/package" --registry=https://npm.pkg.github.com --ignore-scripts
          fi
          npm view "$package" name version repository --registry=https://npm.pkg.github.com --json
          echo "Published [$package](https://github.com/hg1048596-pixel/opencode-orcaterm-auth/packages)" >> "$GITHUB_STEP_SUMMARY"
